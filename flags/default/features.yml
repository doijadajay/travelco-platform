version: "1.6"
namespace: default
flags:
    - key: hotel-discount
      name: Hotel Discount
      type: BOOLEAN_FLAG_TYPE
      description: Enable promotional discounts for hotel bookings.
      enabled: false
    - key: instant-booking
      name: Instant Booking
      type: BOOLEAN_FLAG_TYPE
      description: Allow customers to confirm hotel bookings instantly.
      enabled: false
    - key: new-payment-flow
      name: New Payment Flow
      type: BOOLEAN_FLAG_TYPE
      description: Enable the redesigned payment workflow.
      enabled: false
    - key: new-travel-ui
      name: New Travel UI
      type: BOOLEAN_FLAG_TYPE
      description: Enable the updated TravelCo user interface.
      enabled: false
